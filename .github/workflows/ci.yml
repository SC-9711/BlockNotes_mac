name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm ci
      - run: npm run audit:source
      - run: npm run check
      - run: npm test
      - run: npm run build
      # No original game assets are downloaded or uploaded by public CI.
      # Full Electron E2E runs separately against a user's local resource pack.
