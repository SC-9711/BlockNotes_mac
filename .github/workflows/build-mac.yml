name: macOS build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    # macos-latest runs on Apple Silicon, matching the arm64 target.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm ci
      - run: npm test
      # dist:mac runs the type check and Vite build before packaging.
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # No original game assets are downloaded or packaged; the app fetches them on first launch.
      - run: node scripts/verify-package.mjs release/mac-arm64/BlockNotes.app/Contents --public
      - uses: actions/upload-artifact@v4
        with:
          name: BlockNotes-macOS-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
